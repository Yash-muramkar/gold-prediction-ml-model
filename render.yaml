services:
  - type: web
    name: gold-prediction-ml-model
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OMP_NUM_THREADS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.8"
